services:
  auth-service:
    build: ./services/auth-service
    env_file:
      - .env

  user-service:
    build: ./services/user-service
    env_file:
      - .env

  post-service:
    build: ./services/post-service
    env_file:
      - .env

  like-service:
    build: ./services/like-service
    env_file:
      - .env

  follow-service:
    build: ./services/follow-service
    env_file:
      - .env

  comment-service:
    build: ./services/comment-service
    env_file:
      - .env

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  gateway:
    build: ./gateway
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8000
      POST_SERVICE_URL: http://post-service:8000
      LIKE_SERVICE_URL: http://like-service:8000
      FOLLOW_SERVICE_URL: http://follow-service:8000
      COMMENT_SERVICE_URL: http://comment-service:8000
    depends_on:
      - auth-service
      - user-service
      - post-service
      - like-service
      - follow-service
      - comment-service

volumes:
  prometheus-data:
  grafana-data:
